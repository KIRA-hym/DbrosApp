<!DOCTYPE html>
<html>
<head>
    <title>Image Inspector</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            width: 300px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            background-color: #000;
        }
        h3 {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <h1>Dbros Logo & Icon Inspector</h1>
    <div class="container">
        <div class="card">
            <h3>icon.png (Current Icon)</h3>
            <img src="file:///c:/dbros_app/assets/icon.png" alt="icon.png">
        </div>
        <div class="card">
            <h3>logo_sample.png (New Logo Sample)</h3>
            <img src="file:///c:/dbros_app/assets/logo_sample.png" alt="logo_sample.png">
        </div>
        <div class="card">
            <h3>icon_before_text.png (Template)</h3>
            <img src="file:///c:/dbros_app/assets/icon_before_text.png" alt="icon_before_text.png">
        </div>
        <div class="card">
            <h3>title.png (Title Logo)</h3>
            <img src="file:///c:/dbros_app/assets/title.png" alt="title.png">
        </div>
    </div>
</body>
</html>
