<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>Stats metrics mockup</title>
<style>
body{margin:0;font-family:"Malgun Gothic",sans-serif;background:#121418;color:#e8eaed;padding:20px}
h1{color:#ffc700;font-size:1.2rem}
.card{border:1px solid #3a3f4a;border-radius:8px;padding:12px;margin:8px 0;max-width:320px}
.label{color:#6e717c;font-weight:bold;font-size:.85rem}
.value{text-align:right;color:#ffc700;font-weight:bold;font-size:1.4rem;margin-top:8px}
</style>
</head>
<body>
<h1>통계 지표: 제목 위 / 금액 우측 (0 포함)</h1>
<section class="card">
<p class="label">총 순수익</p>
<p class="value">3,123,000</p>
</section>
<section class="card">
<p class="label">총 지출</p>
<p class="value" style="color:#f87171">0</p>
</section>
</body>
</html>
