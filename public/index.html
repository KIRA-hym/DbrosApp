<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>운행일지관리앱, Dbros</title>
  <meta name="description" content="가장 빠르고 편한 대리운전 보조앱 Dbros. 최신 버전 APK를 다운로드하세요.">
  <link rel="icon" href="icon2.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Pretendard', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #121418 0%, #1A1C23 100%);
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    /* Background animated glowing orbs */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      animation: float 10s infinite alternate;
    }
    .orb-1 {
      width: 300px;
      height: 300px;
      background: rgba(255, 199, 0, 0.15);
      top: 10%;
      left: 10%;
    }
    .orb-2 {
      width: 400px;
      height: 400px;
      background: rgba(255, 82, 82, 0.1);
      bottom: 10%;
      right: 5%;
      animation-delay: -5s;
    }
    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(30px) scale(1.05); }
    }
    /* Main Card */
    .glass-card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 48px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 24px 48px rgba(0,0,0,0.4);
      animation: slideUp 0.8s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .app-icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin: 0 auto 24px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      background: #121418;
    }
    .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(to right, #FFFFFF, #D1D5DB);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 16px;
      color: #9FA3AE;
      margin-bottom: 40px;
      line-height: 1.5;
    }
    /* Version Info Box */
    .version-box {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .version-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .version-label {
      font-size: 13px;
      color: #6E717C;
    }
    .version-value {
      font-size: 18px;
      font-weight: 600;
      color: #FFC700;
    }
    /* Download Button */
    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: #FFC700;
      color: #121418;
      text-decoration: none;
      font-size: 18px;
      font-weight: 800;
      padding: 18px 24px;
      border-radius: 16px;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
      gap: 12px;
    }
    .download-btn:hover {
      background: #FFD533;
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(255, 199, 0, 0.4);
    }
    .download-btn:active {
      transform: translateY(0);
    }
    .download-btn.loading {
      background: #3A3D45;
      color: #9FA3AE;
      pointer-events: none;
      box-shadow: none;
    }
    .footer-text {
      margin-top: 24px;
      font-size: 12px;
      color: #6E717C;
    }
    .footer-text a {
      color: #FFC700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="glass-card">
    <div class="app-icon">
      <img src="icon2.png" alt="Dbros App Icon">
    </div>
    
    <h1 class="title">운행일지관리앱, Dbros</h1>

    <div class="version-box">
      <div class="version-item">
        <span class="version-label">최신 버전</span>
        <span class="version-value" id="latestVersion">-</span>
      </div>
      <div class="version-item">
        <span class="version-label">업데이트일</span>
        <span class="version-value" id="updateDate">-</span>
      </div>
    </div>

    <a id="downloadBtn" href="#" target="_blank" rel="noopener noreferrer" class="download-btn loading">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      로딩 중...
    </a>
    
    <p class="footer-text">안드로이드(Android) 스마트폰 전용<br>다운로드 후 설치 시 출처를 알 수 없는 앱 허용이 필요합니다.</p>
  </div>

  <script>
    // Fetch version data from version.json
    fetch('version.json?t=' + new Date().getTime())
      .then(response => response.json())
      .then(data => {
        document.getElementById('latestVersion').textContent = 'v' + data.latest_version;
        document.getElementById('updateDate').textContent = data.update_date;
        
        const btn = document.getElementById('downloadBtn');
        btn.classList.remove('loading');
        btn.innerHTML = `
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          최신 버전 다운로드 (APK)
        `;
        
        if (data.download_url && data.download_url !== '#') {
          btn.href = data.download_url;
        } else {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            alert('아직 다운로드 링크가 준비되지 않았습니다.');
          });
        }
      })
      .catch(error => {
        console.error('버전 정보를 불러오지 못했습니다.', error);
        document.getElementById('downloadBtn').innerHTML = '오류 발생';
      });
  </script>
</body>
</html>
